# =============================================================
#  NGINX LOAD BALANCER CONFIGURATION
#  Systeme de Messagerie (SMTP, POP3, IMAP, HTTP)
# =============================================================

worker_processes  1;

events {
    worker_connections  1024;
}

# -----------------------------------------------------------
# Section TCP (Stream) : Load Balancing pour SMTP, POP3, IMAP
# -----------------------------------------------------------
stream {
    # -- Cluster SMTP --
    upstream smtp_cluster {
        # Stratégie Round-Robin automatique
        server 127.0.0.1:2526;
        server 127.0.0.1:2527;
    }

    server {
        listen 25; # Port écouté par NGINX
        proxy_pass smtp_cluster;
    }

    # -- Cluster POP3 --
    upstream pop3_cluster {
        server 127.0.0.1:1111;
        server 127.0.0.1:1112;
    }

    server {
        listen 110; # Port écouté par NGINX
        proxy_pass pop3_cluster;
    }

    # -- Cluster IMAP --
    upstream imap_cluster {
        server 127.0.0.1:1431;
        server 127.0.0.1:1432;
    }

    server {
        listen 1430; # Port écouté par NGINX
        proxy_pass imap_cluster;
    }
}

# -----------------------------------------------------------
# Section HTTP : Load Balancing pour l'API Web (Spring Boot)
# -----------------------------------------------------------
http {
    include       mime.types;
    default_type  application/octet-stream;
    
    access_log  logs/access.log;
    error_log   logs/error.log;

    upstream web_cluster {
        server 127.0.0.1:8080;
        server 127.0.0.1:8081;
    }

    server {
        listen      80;
        server_name localhost;

        location / {
            proxy_pass          http://web_cluster;
            proxy_connect_timeout 5s;
        }
    }
}
